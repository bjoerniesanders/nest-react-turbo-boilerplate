version: '3.8'

services:
  postgres_test:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: nest_react_turbo_template_test
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d nest_react_turbo_template_test"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_test_data: 